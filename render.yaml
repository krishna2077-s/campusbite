# Render Blueprint Specification (Infrastructure-as-Code)
# Learn more: https://render.com/docs/blueprint-spec

services:
  # ── 1. Backend: FastAPI Web Service ──────────────────────────────────────────
  - type: web
    name: campusbite-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: sqlite:///./campusbite.db
      - key: OPENAI_API_KEY
        sync: false

  # ── 2. Frontend: React Vite Static Site ──────────────────────────────────────
  - type: web
    name: campusbite-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusbite-backend
          property: host
